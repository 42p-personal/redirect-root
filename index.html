<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>42p.uk</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: #0f1017;
      color: #e2e2f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #6366f1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 18px #6366f155;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #f0f0ff;
    }

    .tagline {
      font-size: 14px;
      color: #7879a0;
      margin-bottom: 44px;
      text-align: center;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 420px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      border-radius: 14px;
      background: #16171f;
      border: 0.5px solid #2a2b3d;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, background 0.15s, transform 0.12s;
      cursor: pointer;
    }

    .card:hover {
      border-color: #6366f166;
      background: #1c1d2a;
      transform: translateY(-1px);
    }

    .card:active {
      transform: translateY(0);
    }

    .card-icon {
      width: 46px;
      height: 46px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .card-text { flex: 1; }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: #e2e2f0;
      margin-bottom: 2px;
    }

    .card-desc {
      font-size: 12px;
      color: #6b6c88;
    }

    .card-arrow {
      font-size: 16px;
      color: #3a3b55;
      transition: color 0.15s, transform 0.15s;
    }

    .card:hover .card-arrow {
      color: #6366f1;
      transform: translateX(2px);
    }

    footer {
      margin-top: 48px;
      font-size: 11px;
      color: #3a3b55;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <div class="logo-icon">🎮</div>
    <h1>42p.uk</h1>
  </div>
  <p class="tagline">The squad's gaming hub</p>

  <div class="cards">
    <a class="card" href="https://calendar.42p.uk">
      <div class="card-icon" style="background:#6366f122; border:0.5px solid #6366f144;">📅</div>
      <div class="card-text">
        <div class="card-title">Game Calendar</div>
        <div class="card-desc">Schedule and track gaming sessions with the squad</div>
      </div>
      <span class="card-arrow">›</span>
    </a>

    <a class="card" href="https://votes.42p.uk">
      <div class="card-icon" style="background:#a855f722; border:0.5px solid #a855f744;">🗳️</div>
      <div class="card-text">
        <div class="card-title">Game Voting</div>
        <div class="card-desc">Nominate and vote on what the squad plays next</div>
      </div>
      <span class="card-arrow">›</span>
    </a>

    <a class="card" href="https://games.42p.uk">
      <div class="card-icon" style="background:#06b6d422; border:0.5px solid #06b6d444;">🕹️</div>
      <div class="card-text">
        <div class="card-title">Upcoming Games</div>
        <div class="card-desc">Browse new and upcoming game releases</div>
      </div>
      <span class="card-arrow">›</span>
    </a>
  </div>

  <footer>42p.uk</footer>
</body>
</html>
