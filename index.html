<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>42p.uk</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: #0f1017;
      color: #e2e2f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .logo-icon {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #f0f0ff;
    }

    .tagline {
      font-size: 14px;
      color: #7879a0;
      margin-bottom: 44px;
      text-align: center;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 420px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      border-radius: 14px;
      background: #16171f;
      border: 0.5px solid #2a2b3d;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, background 0.15s, transform 0.12s;
      cursor: pointer;
    }

    .card:hover {
      border-color: #6366f166;
      background: #1c1d2a;
      transform: translateY(-1px);
    }

    .card:active {
      transform: translateY(0);
    }

    .card-icon {
      width: 46px;
      height: 46px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .card-text { flex: 1; }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: #e2e2f0;
      margin-bottom: 2px;
    }

    .card-desc {
      font-size: 12px;
      color: #6b6c88;
    }

    .card-arrow {
      font-size: 16px;
      color: #3a3b55;
      transition: color 0.15s, transform 0.15s;
    }

    .card:hover .card-arrow {
      color: #6366f1;
      transform: translateX(2px);
    }

    footer {
      margin-top: 48px;
      font-size: 11px;
      color: #3a3b55;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <div class="logo-icon">
      <svg width="52" height="52" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"
        style="transform:rotate(-8deg);filter:drop-shadow(0 4px 16px #7c3aed88)">
        <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#g1)"/>
        <rect x="2" y="2" width="60" height="60" rx="18" stroke="url(#g2)" stroke-width="1.5" fill="none"/>
        <text x="4" y="44" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="-2">4</text>
        <text x="26" y="44" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="34" fill="url(#g3)" letter-spacing="-2">2</text>
        <text x="46" y="52" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="20" fill="#c4b5fd">p</text>
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#4c1d95"/><stop offset="100%" stop-color="#7c3aed"/>
          </linearGradient>
          <linearGradient id="g2" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.6"/><stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="g3" x1="26" y1="10" x2="44" y2="44" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#e9d5ff"/><stop offset="100%" stop-color="#a78bfa"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <h1>42p.uk</h1>
  </div>
  <p class="tagline">The squad's gaming hub</p>

  <div class="cards">
    <a class="card" href="https://calendar.42p.uk">
      <div class="card-icon" style="background:#6366f122; border:0.5px solid #6366f144;">📅</div>
      <div class="card-text">
        <div class="card-title">Game Calendar</div>
        <div class="card-desc">Schedule and track gaming sessions with the squad</div>
      </div>
      <span class="card-arrow">›</span>
    </a>

    <a class="card" href="https://votes.42p.uk">
      <div class="card-icon" style="background:#a855f722; border:0.5px solid #a855f744;">🗳️</div>
      <div class="card-text">
        <div class="card-title">Game Voting</div>
        <div class="card-desc">Nominate and vote on what the squad plays next</div>
      </div>
      <span class="card-arrow">›</span>
    </a>

    <a class="card" href="https://games.42p.uk">
      <div class="card-icon" style="background:#06b6d422; border:0.5px solid #06b6d444;">🕹️</div>
      <div class="card-text">
        <div class="card-title">Upcoming Games</div>
        <div class="card-desc">Browse new and upcoming game releases</div>
      </div>
      <span class="card-arrow">›</span>
    </a>

    <a class="card" href="https://bot.42p.uk">
      <div class="card-icon" style="background:#5865f222; border:0.5px solid #5865f244;">🤖</div>
      <div class="card-text">
        <div class="card-title">Add the Bot</div>
        <div class="card-desc">Sync your calendar to Discord's built-in events</div>
      </div>
      <span class="card-arrow">›</span>
    </a>
  </div>

  <footer>42p.uk</footer>
</body>
</html>
